name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release
        run: swift build -c release --package-path .

      - name: Build app bundle
        run: ./build-app.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Location-Guard
          path: dist/
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: Moonlight-Location-Guard
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Moonlight\ Location\ Guard.app/
          generate_release_notes: true
          fail_on_unmatched_files: true
